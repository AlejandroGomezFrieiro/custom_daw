[package]
name = "paw-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A graphical frontend, drawn with egui. It talks to the kernel over its control socket."

[dependencies]
anyhow.workspace = true
paw-proto.workspace = true
paw-listen.workspace = true
paw-raster.workspace = true
paw-scene.workspace = true
serde_json.workspace = true
libc = "0.2"
unicode-width = "0.2"
# OpenGL through glow: it runs on any driver, Mesa's llvmpipe too, so the
# window needs no graphics card. X11 and Wayland, and the clipboard. Not
# egui's own fonts (one is under the Ubuntu font licence): the window
# brings its own.
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "clipboard"] }
egui = { version = "0.37", default-features = false }
# The icons are SVG paths: read with kurbo, filled with tiny-skia.
kurbo = "0.13"
tiny-skia = "0.12"
# To try a font of the system's with the parser egui draws with.
skrifa = "0.44"
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }

[dev-dependencies]
egui_kittest = "0.37"
