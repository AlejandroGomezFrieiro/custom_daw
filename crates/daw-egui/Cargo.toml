[package]
name = "daw-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A graphical frontend, drawn with egui. It talks to the kernel over its control socket."

[[bin]]
name = "daw-egui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
daw-proto.workspace = true
daw-listen.workspace = true
daw-raster.workspace = true
serde_json.workspace = true
libc = "0.2"
# OpenGL through glow: it runs on any driver, llvmpipe included, so the
# window needs no graphics card. X11 and Wayland, and the clipboard.
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "clipboard", "default_fonts"] }
egui = "0.37"
# The icons are SVG paths: read with kurbo, filled with tiny-skia.
kurbo = "0.13"
tiny-skia = "0.12"
# To try a font of the system's with the parser egui draws with.
skrifa = "0.44"
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }

[dev-dependencies]
egui_kittest = "0.37"
