[package]
name = "daw-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A graphical frontend. It talks to the kernel over its control socket."

[dependencies]
anyhow.workspace = true
daw-proto.workspace = true
daw-listen.workspace = true
daw-raster.workspace = true
serde_json.workspace = true
libc = "0.2"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "unstable-winit-030", "renderer-software", "renderer-femtovg"] }
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }

[build-dependencies]
slint-build = "1.18"
